<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POLLARIS - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Biblioteca global do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="justify-content: center; align-items: center;">
  <div class="form-card" style="width: 100%;">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-family: 'Playfair Display', serif; font-size: 1.75rem; font-weight: 700; color: #0f172a; margin-bottom: 6px;">Bem-vindo de volta!</h2>
      <p style="color: #64748b; font-size: 0.85rem;">Entre na sua conta para continuar</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="login-email" required placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-password" required placeholder="••••••••"/>
      </div>
      <button type="submit" class="btn-submit" style="margin-top: 8px;">Entrar na Conta</button>
    </form>

    <p style="text-align: center; font-size: 0.85rem; color: #64748b; margin-top: 20px;">
      Não tem conta? <a href="cadastro.html" style="color: var(--brand-teal); font-weight: 600; text-decoration: none;">Cadastre-se</a>
    </p>
  </div>

  <!-- Note que agora NÃO usamos type="module" -->
  <script src="js/auth.js"></script>
</body>
</html>
