<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PorLares — Entrar na Conta</title>
  <meta name="description" content="Acesse sua conta no PorLares Marketplace para anunciar produtos e gerenciar suas vendas.">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <!-- Cabeçalho Simplificado -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div>
          <span class="logo-text">PorLares</span>
          <span class="logo-tagline">Marketplace</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="index.html" class="nav-link">
          <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
          <span>Voltar ao Início</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Container do Formulário -->
  <main class="container" style="display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="form-card" style="width: 100%; max-width: 460px; margin: 0;">
      <div class="form-header">
        <h1 class="form-title">Bem-vindo de volta!</h1>
        <p class="form-subtitle">Entre na sua conta para anunciar e gerenciar seus produtos</p>
      </div>

      <!-- Caixa de Mensagem / Erro -->
      <div id="auth-error-box" class="alert-box alert-danger" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Seu E-mail <span class="required">*</span></label>
          <input type="email" id="login-email" required placeholder="seu@email.com" autocomplete="email"/>
        </div>

        <div class="form-group">
          <label for="login-password">Sua Senha <span class="required">*</span></label>
          <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password"/>
        </div>

        <button type="submit" class="btn-submit" style="margin-top: 10px;">
          <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
          <span>Entrar na Conta</span>
        </button>
      </form>

      <p style="text-align: center; font-size: 0.875rem; color: var(--text-muted); margin-top: 24px;">
        Ainda não tem conta no PorLares? 
        <a href="cadastro.html" style="color: var(--brand-teal); font-weight: 700; text-decoration: none;">Cadastre-se grátis</a>
      </p>
    </div>
  </main>

  <!-- Rodapé -->
  <footer>
    <div class="footer-bottom">
      <p>© 2026 PorLares Marketplace. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="js/auth.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
