<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POLLARIS - Anunciar Produto</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo"><span class="logo-text">POLLARIS</span></a>
      <a href="index.html" style="color: var(--brand-teal); text-decoration: none; font-size: 0.85rem; font-weight: 600;">Voltar ao Início</a>
    </div>
  </header>

  <main class="container" style="max-width: 700px;">
    <div style="margin-bottom: 24px;">
      <h1 style="font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: #0f172a;">Anunciar Produto</h1>
      <p style="color: #64748b; font-size: 0.9rem;">Preencha os dados abaixo para publicar o seu item no marketplace[cite: 1].</p>
    </div>

    <form id="form-anunciar" class="form-card" style="max-width: 100%;">
      <div class="form-group">
        <label>Nome do produto *</label>
        <input type="text" id="prod-name" required placeholder="Ex: Smartphone Samsung Galaxy"/>
      </div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label>Categoria *</label>
          <select id="prod-cat" required>
            <option value="Eletrônicos">Eletrônicos</option>
            <option value="Moda">Moda</option>
            <option value="Casa & Jardim">Casa & Jardim</option>
            <option value="Esportes">Esportes</option>
          </select>
        </div>
        <div class="form-group">
          <label>Preço (R$) *</label>
          <input type="number" step="0.01" id="prod-price" required placeholder="0,00"/>
        </div>
      </div>

      <div class="form-group">
        <label>URL da Imagem *</label>
        <input type="url" id="prod-img" required placeholder="https://exemplo.com/imagem.jpg"/>
      </div>

      <div class="form-group">
        <label>Descrição *</label>
        <textarea id="prod-desc" rows="4" required placeholder="Detalhes, estado de conservação e características..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Publicar Anúncio</button>
    </form>
  </main>

  <footer>
    <p>© 2026 POLLARIS Marketplace[cite: 1].</p>
  </footer>

  <script type="module" src="js/produtos.js"></script>
</body>
</html>
